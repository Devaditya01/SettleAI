services:
  - type: web
    name: settleai
    runtime: python
    plan: free
    buildCommand: pip install --prefer-binary --no-build-isolation -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: LLM_PRIMARY_PROVIDER
        value: gemini
      - key: LLM_TIMEOUT_SECONDS
        value: 15
      - key: LLM_MAX_RETRIES
        value: 1
